<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subdomain factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=100">
<style>
:root{font:400 14px/1.5 var(--font-ui);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:24px;padding:0 20px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
.dom{display:flex;align-items:center;gap:10px;font-weight:600}
.dom i{width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--on-ink);font:600 10px var(--font-ui);font-style:normal;display:grid;place-items:center}
.dom span{color:var(--ink3);font-weight:400}
.crumb{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb a{color:var(--ink2);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--ink)}
.kpi{margin-left:auto;display:flex;gap:22px}
.kpi div{font-size:12px;color:var(--ink2);line-height:1.2}
.kpi b{display:block;font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.kpi b small{font-size:11px;font-weight:400;color:var(--ink3)}
.kpi i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.legend{position:fixed;left:20px;bottom:18px;z-index:4;display:flex;gap:16px;font-size:12px;color:var(--ink2);background:var(--glass);backdrop-filter:blur(10px);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block}
.drawer{position:fixed;top:56px;right:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--line);z-index:5;display:flex;flex-direction:column;transform:translateX(0);transition:transform .25s ease}
.drawer.closed{transform:translateX(100%)}
.dh{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dh .k{font-size:12px;color:var(--ink3)}
.dh h2{margin:2px 0 0;font-size:19px;font-weight:600;line-height:1.25;word-break:break-word}
.dh .x{position:absolute;top:14px;right:14px;border:0;background:none;font-size:20px;color:var(--ink3);cursor:pointer}
.db{padding:14px 20px 24px;overflow-y:auto;flex:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.stat div{padding:10px 12px}
.stat div+div{border-left:1px solid var(--line)}
.stat b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.sec{font-size:12px;color:var(--ink3);margin:16px 0 6px;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;font-size:13px}
.row:hover{background:var(--bg2)}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font-style:normal;color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.grey{background:var(--grey)}
.filters{display:flex;gap:6px;margin:0 0 8px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.check{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;padding:5px 0}
.check i{font-style:normal;font-weight:700;text-align:center}
.check i.y{color:var(--ok)}.check i.n{color:var(--bad)}
.check small{display:block;color:var(--ink2);font-size:12px}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.flow b{display:block;font-size:16px;font-weight:600}
.flow span{color:var(--ink2)}
.flow .mid{color:var(--ink3);font-size:18px}
.acts{display:grid;gap:8px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn small{color:var(--ink3);font-size:12px}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary small{color:color-mix(in srgb,var(--on-ink) 72%,var(--ink))}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:8px 0;font-size:13px;border-top:1px solid var(--line);opacity:.35;transition:opacity .3s}
.steps li.on,.steps li.done{opacity:1}
.steps li i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink3);margin-top:2px;display:block}
.steps li.on i{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done i{background:var(--ok);border-color:var(--ok)}
.steps small{display:block;color:var(--ink2);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.diff{font-size:12px;background:var(--bg2);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.5;color:var(--ink2)}
.diff b{color:var(--ink);font-weight:600}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(var(--shadow-rgb),.08)}
.lbl em{font-style:normal;font-weight:500;color:var(--ink2)}
.lbl.hot{border-color:var(--bad)}
.legend{flex-wrap:wrap;max-width:calc(100% - 40px)}
.hint{position:fixed;right:20px;bottom:22px;font-size:12px;color:var(--ink3);z-index:4}
@media (max-width:1100px){.hint{display:none}}
.layers{display:flex;background:var(--chip);border-radius:999px;padding:3px;margin-left:8px}
.layers button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.layers button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(var(--shadow-rgb),.12)}
.bn{font-size:10.5px;font-weight:600;color:var(--on-accent);background:var(--bad);border-radius:5px;padding:0 5px}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:280px;box-shadow:0 10px 30px rgba(var(--shadow-rgb),.14);font-size:12.5px}
#tip b{display:block;font-size:14px;margin-bottom:6px}
#tip .tg{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin-bottom:8px}
#tip .tg span{color:var(--ink2)}
#tip .tg em{font-style:normal;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#tip .up{color:var(--ok)}#tip .dn{color:var(--bad)}
#tip small{color:var(--ink3);display:block}
#tip i.mock{font-style:normal}
.mock{font-size:11px;color:var(--warn-ink);background:var(--warn-soft);border-radius:5px;padding:0 6px;font-weight:500}
.embed .dom{display:none}
.layers{display:none!important}
.lbl.nb{cursor:pointer;font-weight:600;background:var(--chip);border-color:var(--chip);color:var(--ink2);box-shadow:none}
.lbl.nb>span:last-child{display:grid;gap:0}.lbl.nb i{font-style:normal;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.lbl.nb.inn i{color:var(--rel-sup)}.lbl.nb.out i{color:var(--rel-con)}
.lbl.nb small{font-size:11px;font-weight:500;color:var(--ink2)}.lbl.nb .dot{margin-top:4px}
.lbl.nbh{cursor:pointer;flex-direction:column;align-items:flex-start;gap:0;background:var(--surface)}.lbl.nbh b{font-size:12.5px}.lbl.nbh span{font-size:11.5px;font-weight:500;color:var(--ink2)}.lbl.nbh strong{color:var(--ink)}
.row.nbo small{display:block;color:var(--ink3);font-weight:400;font-size:11px;white-space:normal}
#tour{position:fixed;left:20px;bottom:64px;z-index:20;width:min(400px,calc(100% - 40px));background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;box-shadow:0 12px 32px rgba(var(--shadow-rgb),.16);padding:12px 14px;display:grid;gap:6px;font-size:13px}
#tour .th{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--accent);font-weight:600}#tour .th button{border:0;background:none;font-size:18px;color:var(--ink3);cursor:pointer}
#tour b{font-size:15px}#tour p{margin:0;color:var(--ink2);line-height:1.5}#tour p a{color:var(--accent)}
#tour .td{display:flex;gap:4px}#tour .td i{width:16px;height:4px;border-radius:2px;background:var(--track)}#tour .td i.done{background:var(--accent-line)}#tour .td i.on{background:var(--accent)}
#tour .tb{display:flex;gap:8px;justify-content:flex-end}#tour .tb button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}#tour .tb button:disabled{opacity:.4;cursor:default}#tour .tb .pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lbl.staff{flex-direction:column;align-items:flex-start;gap:0;font-weight:500;padding:3px 8px;background:var(--glass-strong)}
.lbl.staff span{font-size:10.5px;color:var(--ink3);font-weight:500}
.lbl.staff b{font-size:12px;font-weight:600}
.lbl.staff em{font-style:normal;font-size:10.5px;color:var(--ink2)}
.lbl.staff.vac{border-color:var(--bad)}
.lbl.staff.vac b{color:var(--bad)}
.lbl.staff.office b{display:block}.lbl.staff.office b em{font-weight:400;color:var(--ink3)}.lbl.staff.office b.vac{color:var(--bad)}.lbl.staff.office{border-color:var(--accent-line)}.lbl.staff.office>span{color:var(--accent);font-weight:600}
.bn{display:inline-flex;align-items:center;gap:3px}
.bn .pi{flex:none;display:block}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<header class="bar">
  <div class="dom"><i>IF</i></div>
  <div class="crumb" id="crumb"></div>
  <nav class="layers" id="layers"><button data-l="health" aria-pressed="true">Health</button><button data-l="pop" aria-pressed="false">Popularity</button><button data-l="cert" aria-pressed="false">Certification</button></nav>
  <div class="kpi" id="kpi"></div>
</header>
<aside class="drawer" id="drawer"><div class="dh" id="dh"></div><div class="db" id="db"></div></aside>
<div class="legend" id="legend"></div>
<div id="tip" hidden></div>
<div class="hint" id="hint">Click a workshop to inspect, scroll to zoom, right-drag to pan</div>
<script type="module" src="app.js?v=100"></script>
</body>
</html>
