<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=100">
<style>
:root{font:400 14px/1.5 var(--font-ui);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
button,a{font:inherit;color:inherit}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px 7px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(var(--shadow-rgb),.08)}
.lbl em{font-style:normal;font-weight:500;color:var(--ink2)}
.plate{position:absolute;left:0;top:0;white-space:nowrap;background:var(--glass-strong);border:1px solid var(--line);border-radius:8px;padding:3px 8px 4px;box-shadow:0 2px 10px rgba(var(--shadow-rgb),.08);font-size:11.5px;line-height:1.3}
.plate.mini .m span+span{display:none}
.plate.mini{padding:2px 7px 3px}
.plate b{display:block;font-size:12.5px;font-weight:650}
.plate .m{display:flex;gap:8px;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.plate .m span{display:inline-flex;align-items:center;gap:5px}
.lbl.unit{background:none;border:0;box-shadow:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:0}
.lbl.unit em{color:var(--ink3);letter-spacing:0}
.lbl.sel{border-color:var(--ink);box-shadow:0 2px 10px rgba(var(--shadow-rgb),.18)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.grey{background:var(--grey)}
.bn{font-size:10.5px;font-weight:600;color:var(--on-accent);background:var(--bad);border-radius:5px;padding:0 5px}
.ctl{position:fixed;top:14px;left:16px;z-index:5;display:flex;gap:10px;align-items:center}
.layers{display:flex;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:3px}
.layers button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.layers button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.back{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.back:hover{color:var(--ink)}
.back{text-decoration:none}
.back.brand{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600}
.back.brand:hover{color:var(--on-ink)}
.legend{position:fixed;left:16px;bottom:14px;z-index:4;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);background:var(--glass);backdrop-filter:blur(10px);padding:8px 12px;border-radius:10px;border:1px solid var(--line);max-width:calc(100% - 32px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block}
#tip{position:fixed;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:290px;box-shadow:0 10px 30px rgba(var(--shadow-rgb),.14);font-size:12.5px}
#tip h4{margin:0;font-size:14px;font-weight:600}
#tip .k{color:var(--ink3);font-size:11.5px;margin-bottom:8px}
#tip .tg{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-bottom:10px}
#tip .tg span{color:var(--ink2);display:flex;align-items:center;gap:6px}
#tip .tg em{font-style:normal;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#tip .acts{display:flex;gap:6px}
#tip .acts a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
#tip .acts a.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
#tip .acts a:hover{border-color:var(--ink3)}
.hint{position:fixed;right:16px;top:20px;font-size:12px;color:var(--ink3);z-index:4}
@media (max-width:1100px){.hint{display:none}}
.plate.city{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.plate.city .m{color:color-mix(in srgb,var(--on-ink) 72%,var(--ink))}
#tip .ppl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:-2px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#tip .ppl span{color:var(--ink3)}#tip .ppl b{font-weight:600;text-align:right}
#tip .ppl i.no{font-style:normal;color:var(--bad)}
.bn{display:inline-flex;align-items:center;gap:3px}
.bn .pi{flex:none;display:block}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div class="ctl"><a class="back brand" href="index.html#/">← Insight Factories</a><a class="back" href="index.html#/">Catalog</a><button class="back" id="home" hidden>All factories</button><a class="back" id="domlink" hidden></a></div>
<div class="legend" id="legend"></div>
<div id="tip" hidden></div>
<div class="hint">Hover a building for metrics, click to open the factory. Click a plot to zoom in</div>
<script type="module" src="map.js?v=100"></script>
</body>
</html>
